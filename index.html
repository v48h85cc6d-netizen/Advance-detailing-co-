<!doctype html>
<html lang="sq" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--SEO:START-->
    <title>ADVANCE DETAILING CO. — Detailing Premium në Prishtinë</title>
    <meta name="description" content="Studio premium e detailing-ut automobilistik në Prishtinë." />
    <!--SEO:END-->
    <meta name="theme-color" content="#050505" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/assets/logo/logo-nav-white.svg" as="image" />
    <script>
      // Apply saved theme before first paint to prevent a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('adc-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          var r = document.documentElement;
          r.classList.remove('dark', 'light');
          r.classList.add(t);
          r.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#050505' : '#f5f5f4');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;font-family:sans-serif;text-align:center">
        ADVANCE DETAILING CO. — Xhevat Qena, Prishtinë 10000, Kosovë · +383 (0) 49 909 229 · info@advancedetailingco.com
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
